name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Юнит-тесты
        run: npm test
      - name: Сквозной тест в Chrome
        continue-on-error: true
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())") npm run e2e
      - name: Сборка zip
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vsemvamdam-Steam-Helper
          path: dist/*.zip
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
